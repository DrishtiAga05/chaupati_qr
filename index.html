<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gulabi Chowk</title>

<style>
body{
    font-family: Arial,sans-serif;
    margin:0;
    padding:20px;
    background:#fff7f0;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:150px;
}

h1{
    text-align:center;
    color:#e65100;
}

.search-box{
    max-width:600px;
    margin:20px auto;
}

.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

.stalls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.stall-card{
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.stall-card h3{
    margin-top:0;
}

.stall-card a{
    display:inline-block;
    margin-top:10px;
    background:#ff5722;
    color:white;
    text-decoration:none;
    padding:8px 15px;
    border-radius:8px;
}

.instagram-section{
    text-align:center;
    margin-top:40px;
}

.instagram-section img{
    width:180px;
    border-radius:12px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#555;
}
</style>
</head>

<body>

<div class="logo">
    <img src="gulabi-logo.jpeg" alt="Gulabi Chowk">
</div>

<h1>Welcome to Gulabi Chowk</h1>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="Search stall or food item..."
        onkeyup="searchStalls()">
</div>

<div class="stalls" id="stallContainer"></div>

<div class="instagram-section">
    <h3>Follow Us On Instagram</h3>

    <a href="https://www.instagram.com/gulabichowkjaipur?igsh=MTVmeHoydGtjaDh5Ng==" target="_blank">
        <img src="instagram-qr.png" alt="Instagram QR">
    </a>
</div>

<div class="footer">
    Thank you for visiting Gulabi Chowk ❤️
</div>

<script>

const stalls = [

{
name:"Pandit Pav Bhaji",
page:"pandit-pav-bhaji.html",
items:[
"Pav Bhaji",
"Cheese Pav Bhaji",
"Dabeli",
"Vada Pav"
]
},

{
name:"Madras Cafe",
page:"madras-cafe.html",
items:[
"Masala Dosa",
"Plain Dosa",
"Mysore Dosa",
"Idli Sambhar",
"Vada Sabhar",
"Uttapam"
]
},

{
name:"Corbett Coffee",
page:"corbett-coffee.html",
items:[
"Cold Coffee",
"Hot Coffee",
"Cappuccino",
"Latte",
"Chocolate Frappe",
"Hazelnut Frappe"
]
},

{
name:"Punjabi Soya Chaap",
page:"punjabi-soya-chaap.html",
items:[
"Malai Chaap",
"Afghani Chaap",
"Tandoori Chaap",
"Masala Chaap"
]
},

{
name:"Chinese Corner",
page:"chinese-corner.html",
items:[
"Veg Noodles",
"Hakka Noodles",
"Momos",
"Fried Rice",
"Spring Roll",
"Manchurian"
]
},

{
name:"Shiv Juice Center",
page:"shiv-juice-center.html",
items:[
"Mango Shake",
"Banana Shake",
"Pineapple Juice",
"Orange Juice",
"Watermelon Juice",
"Mix Fruit Juice"
]
}

];

function renderStalls(list){

const container =
document.getElementById("stallContainer");

container.innerHTML="";

list.forEach(stall=>{

container.innerHTML += `
<div class="stall-card">
<h3>${stall.name}</h3>

<a href="${stall.page}">
View Menu
</a>
</div>
`;

});

}

function searchStalls(){

const query =
document.getElementById("search")
.value
.toLowerCase();

const filtered =
stalls.filter(stall=>{

const stallMatch =
stall.name.toLowerCase().includes(query);

const itemMatch =
stall.items.some(item=>
item.toLowerCase().includes(query)
);

return stallMatch || itemMatch;

});

renderStalls(filtered);

}

renderStalls(stalls);

</script>

</body>
</html>
