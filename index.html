<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gulabi Chowk</title>

<style>
body{
    font-family: Arial,sans-serif;
    margin:0;
    padding:20px;

    background:
        linear-gradient(
            rgba(255,255,255,0.88),
            rgba(255,255,255,0.88)
        ),
        url('background.jpeg');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:150px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:25px;
    padding:0 10px;
}

.gulabi-logo{
    width:80px;
    height:80px;
    object-fit:contain;
}

.choice-section{
    text-align:center;
}

.chatokda-logo{
    width:110px;
    height:110px;
    object-fit:contain;
}

.chatokda-text{
    margin-top:4px;
    font-size:14px;
    font-weight:700;
    color:#444;
}

h1{
    text-align:center;
    color:#c2185b;
    font-size:3rem;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.search-box{
    max-width:600px;
    margin:20px auto;
}

.search-box input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    font-size:16px;
    background:rgba(255,255,255,0.95);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.stalls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.stall-card{
    background:rgba(255,255,255,0.92);
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    border-left:5px solid #e91e63;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stall-card h3{
    margin:0;
    color:#333;
    font-size:1.1rem;
    font-weight:600;
}

.stall-card a{
    background:#e91e63;
    color:white;
    text-decoration:none;
    padding:8px 16px;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.stall-card a:hover{
    transform:translateY(-2px);
}

.instagram-section{
    text-align:center;
    margin-top:40px;
}

.instagram-section img{
    width:180px;
    border-radius:12px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#555;
}

@media(max-width:600px){

    .gulabi-logo,
    .chatokda-logo{
        width:70px;
        height:70px;
    }

    h1{
        font-size:1.9rem;
    }

    .stall-card{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }
}

</style>
</head>

<body>

<div class="top-bar">

    <img src="gulabi-logo.jpeg"
         alt="Gulabi Chowk"
         class="gulabi-logo">

    <div class="choice-section">

        <img src="chatokda-logo.jpeg"
             alt="Chatokda"
             class="chatokda-logo">

        <div class="chatokda-text">
            Chatokda's Choice
        </div>

    </div>

</div>

<h1>Welcome to Gulabi Chowk</h1>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="Search stall or food item..."
        onkeyup="searchStalls()">
</div>

<div class="stalls" id="stallContainer"></div>

<div style="text-align:center; margin-top:30px;">

    <a href="feedback.html"
       style="
       background:#e91e63;
       color:white;
       padding:12px 25px;
       border-radius:10px;
       text-decoration:none;
       font-weight:bold;
       display:inline-block;">

       📝 Give Feedback

    </a>

</div>

<div class="instagram-section" style="text-align:center; margin:20px 0;">

        <p style="margin-bottom:10px; font-weight:600;">
            Follow us on Instagram!
        </p>

        <!-- QR Code -->
        <img src="instagram-qr.jpeg"
            alt="Instagram QR"
            style="width:140px; height:140px;">

        <!-- Link -->
        <p style="margin-top:10px;">
            <a href="https://www.instagram.com/gulabichowkjaipur?igsh=MTVmeHoydGtjaDh5Ng=="
            target="_blank">
                Open Instagram Page
            </a>
        </p>

</div>

<div class="footer">
    Thank you for visiting Gulabi Chowk ❤️
</div>

<script>

const stalls = [

{
name:"Pandit Pav Bhaji",
page:"pandit-pav-bhaji.html",
items:[
"Pav Bhaji",
"Cheese Pav Bhaji",
"Dabeli",
"Vada Pav"
]
},

{
name:"Madras Cafe",
page:"madras-cafe.html",
items:[
"Masala Dosa",
"Plain Dosa",
"Mysore Dosa",
"Idli Sambar",
"Vada Sambar",
"Uttapam"
]
},

{
name:"Corbett Coffee",
page:"corbett-coffee.html",
items:[
"Cold Coffee",
"Hot Coffee",
"Cappuccino",
"Latte",
"Chocolate Frappe",
"Hazelnut Frappe"
]
},

{
name:"Punjabi Soya Chaap",
page:"punjabi-soya-chaap.html",
items:[
"Malai Chaap",
"Afghani Chaap",
"Tandoori Chaap",
"Masala Chaap"
]
},

{
name:"Chinese Corner",
page:"chinese-corner.html",
items:[
"Veg Noodles",
"Hakka Noodles",
"Momos",
"Fried Rice",
"Spring Roll",
"Manchurian"
]
},

{
name:"Shiv Juice Center",
page:"shiv-juice-center.html",
items:[
"Mango Shake",
"Banana Shake",
"Pineapple Juice",
"Orange Juice",
"Watermelon Juice",
"Mix Fruit Juice"
]
}

];

function renderStalls(list){

const container =
document.getElementById("stallContainer");

container.innerHTML="";

list.forEach(stall=>{

container.innerHTML += `
<div class="stall-card">
<h3>${stall.name}</h3>

<a href="${stall.page}">
View Menu
</a>
</div>
`;

});

}

function searchStalls(){

const query =
document.getElementById("search")
.value
.toLowerCase();

const filtered =
stalls.filter(stall=>{

const stallMatch =
stall.name.toLowerCase().includes(query);

const itemMatch =
stall.items.some(item=>
item.toLowerCase().includes(query)
);

return stallMatch || itemMatch;

});

renderStalls(filtered);

}

renderStalls(stalls);

</script>

</body>
</html>
