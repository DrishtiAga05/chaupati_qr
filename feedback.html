<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback | Gulabi Chowk</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(
            rgba(255,255,255,0.88),
            rgba(255,255,255,0.88)
        ),
        url('background.jpeg');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:25px;
    padding:0 10px;
}

.gulabi-logo{
    width:80px;
    height:80px;
    object-fit:contain;
}

.choice-section{
    text-align:center;
}

.chatokda-logo{
    width:110px;
    height:110px;
    object-fit:contain;
}

.chatokda-text{
    margin-top:4px;
    font-size:14px;
    font-weight:700;
    color:#444;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    color:#c2185b;
    font-size:2.8rem;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}

.form-container{
    background:rgba(255,255,255,0.95);
    border-radius:15px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

iframe{
    width:100%;
    min-height:1300px;
    border:none;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#666;
}

@media(max-width:600px){

    .gulabi-logo,
    .chatokda-logo{
        width:70px;
        height:70px;
    }

    .page-title h1{
        font-size:1.8rem;
    }

}

</style>

</head>

<body>

<div class="container">
    <div class="top-bar">

        <img src="gulabi-logo.jpeg"
             alt="Gulabi Chowk"
            class="gulabi-logo">
    </div>
    <div class="choice-section">

        <img src="chatokda-logo.jpeg"
             alt="Chatokda"
             class="chatokda-logo">

        <div class="chatokda-text">
            Chatokda's Choice
        </div>

    </div>

</div>

<div class="page-title">
    <h1>Customer Feedback</h1>
</div>

<div class="form-container">

    <iframe
    src="https://docs.google.com/forms/d/e/1FAIpQLScgU8FG6Wdpk1HjnIvDRBeJ7ZrrxxRZTWeF7O2PoNb0JwJpLQ/viewform?embedded=true">
    </iframe>

</div>

<div class="footer">
    Thank you for helping us improve ❤️
</div>

</div>

</body>
</html>
